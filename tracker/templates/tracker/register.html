{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Enterprise Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'tracker/style.css' %}">
</head>
<body class="login-container">
    <div class="login-card" style="max-width: 500px; padding: 30px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <i class="bi bi-person-plus-fill" style="font-size: 2.5rem; color: var(--color-primary); display: inline-block; margin-bottom: 8px;"></i>
            <h2 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px;">Create Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.8rem;">Join the HRMS & Presence Monitoring System</p>
        </div>
        
        {% if error %}
        <div style="padding: 10px 14px; background-color: hsla(350, 80%, 55%, 0.15); border-left: 3px solid var(--state-offline); border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--state-offline); margin-bottom: 15px;">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="johndoe" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" placeholder="John" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label for="email">Work Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="john@company.com" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="designation">Designation</label>
                    <input type="text" id="designation" name="designation" class="form-control" placeholder="Software Engineer" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="laptop_mac">Laptop MAC (Optional)</label>
                    <input type="text" id="laptop_mac" name="laptop_mac" class="form-control" placeholder="AA:BB:CC:DD:EE:FF">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="department">Department</label>
                    <select name="department" id="department" class="form-control" required>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="office_location">Office Location</label>
                    <select name="office_location" id="office_location" class="form-control" required>
                        {% for loc in office_locations %}
                        <option value="{{ loc.id }}">{{ loc.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
                Create Account & Sign In <i class="bi bi-arrow-right" style="margin-left: 4px;"></i>
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 15px; font-size: 0.85rem;">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--color-primary); text-decoration: none; font-weight: 600;">Sign In</a>
        </div>
    </div>
</body>
</html>
